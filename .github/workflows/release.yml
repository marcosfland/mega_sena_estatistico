name: Release

# Para publicar uma versão:  git tag v2.1.0 && git push origin v2.1.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    name: Executável Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Dependências
        run: pip install -r requirements.txt pyinstaller
      - name: Testes antes de empacotar
        run: python -m pytest
      - name: Gerar executável
        run: python build_executable.py
      - name: Compactar
        shell: pwsh
        run: |
          $name = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { 'teste' }
          Compress-Archive -Path dist/LoteriasEstatistico -DestinationPath "LoteriasEstatistico-$name-windows.zip"
      - name: Guardar artefato (execução manual)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: LoteriasEstatistico-windows
          path: LoteriasEstatistico-*-windows.zip
      - name: Publicar release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: LoteriasEstatistico-*-windows.zip
          generate_release_notes: true
